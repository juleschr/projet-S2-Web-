<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact & Jeu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 class="title">Contactez-nous</h2>

    <form id="contactForm" novalidate>
        <input type="text" id="fullname" placeholder="Prénom Nom">
        <p class="error" id="errName"></p>

        <input type="email" id="email" placeholder="email@example.com">
        <p class="error" id="errEmail"></p>

        <textarea id="message" placeholder="Votre message doit contenir 20 à 1000 caractères"></textarea>
        <p class="error" id="errMessage"></p>

        <button id="sendBtn" disabled>Envoyer</button>
    </form>

    <p id="status" class="status"></p>

    <!--Affichage du jeu lorque l'utilisateur appuie sur le bouton envoyer -->
    <div id="gameZone" style="display:none; margin-top:40px;">
        <h3>Jeu : Pierre Feuille Ciseaux</h3>

        <div class="choices">
            <button class="choice" data-value="pierre">Pierre</button>
            <button class="choice" data-value="feuille">Feuille</button>
            <button class="choice" data-value="ciseaux">Ciseaux</button>
        </div>

        <p id="result" class="result"></p>
    </div>

    <script src="page5.js"></script>

</body>
</html>
